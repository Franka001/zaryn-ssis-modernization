name: Build dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reporting.py
      - reports/dashboard_data.csv
      - .github/workflows/build-dashboard.yml
permissions:
  contents: write
concurrency:
  group: build-dashboard
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install matplotlib==3.9.4
      - run: python -m unittest -v
      - run: python reporting.py
      - name: Commit generated PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update Zaryn dashboard PNG'
            git push
          fi
